spring:
  application:
    name: ckp
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/postgres
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

server:
  port: ${PORT:9080}

app:
  jwks-uri: ${SUPABASE_JWKS_URI:https://uxyswambwshpgmqjhgtj.supabase.co/auth/v1/.well-known/jwks.json}
  deepseek-api-key: ${DEEPSEEK_API_KEY}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
